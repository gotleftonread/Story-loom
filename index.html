<!--
  This page calls "/api/story" — a small serverless function (see
  /functions/api/story.js) that supports two AI providers, Gemini and Groq.
  The site's default key(s) live server-side as Cloudflare env vars
  (GEMINI_API_KEY / GROQ_API_KEY), or a player can paste their own key via
  the in-app "API key" button (stored only in localStorage, sent per-request).

  Token-saving note: the last 8 turns are resent in full each time (so the
  AI retains real detail), and only anything older than that gets folded
  into a short running summary — this keeps a single request from growing
  forever on a very long story, without sacrificing memory for typical ones.

  NOTE: this build has the React/JSX code pre-compiled to plain JavaScript
  ahead of time (no Babel-in-browser step), so it renders reliably both
  locally (opened directly as a file) and once deployed.
